<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>티어 메이커 — 트릭컬 스킬 가이드</title>
    <script src="theme.js"></script>
    <link rel="icon" href="assets/icons/common_icons/NerIcon.webp" type="image/webp">
    <script src="version.js"></script>
    <script>
        document.write('<link rel="stylesheet" href="style.css?v=' + APP_VERSION + '">');
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>

<div class="tm-header">
    <div class="tm-header-left">
        <a href="./" class="tm-hbtn tm-hbtn-back" aria-label="메인으로 돌아가기" title="메인으로 돌아가기">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
        </a>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 21l8 0"/><path d="M12 17l0 4"/>
            <path d="M7 4l10 0"/>
            <path d="M17 4v8a5 5 0 0 1 -10 0v-8"/>
            <path d="M5 9m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/>
            <path d="M19 9m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/>
        </svg>
        <span>티어 메이커</span>
    </div>
    <div class="tm-header-right">
        <button class="tm-hbtn tm-hbtn-export" onclick="window._tmExport()">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            PNG 저장
        </button>
        <button class="tm-hbtn tm-hbtn-reset" onclick="window._tmClearAll()" aria-label="전체 미배치로 이동" title="전체 미배치로 이동">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"/><path d="M8 6V4h8v2"/>
                <path d="M19 6l-1 14H6L5 6"/>
            </svg>
            전체 미배치
        </button>
        <button class="tm-hbtn tm-hbtn-reset" onclick="window._tmReset()" aria-label="기본값으로 초기화" title="기본값으로 초기화">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
            </svg>
            기본값
        </button>
        <button class="tm-hbtn tm-hbtn-theme" onclick="window.toggleTheme()" aria-label="테마 전환" title="테마 전환">
            <svg class="tm-ti-light" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg class="tm-ti-dark" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"/>
                <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
                <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
                <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
                <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>
            </svg>
        </button>
    </div>
</div>

<div class="tm-body">
    <div id="tm-board" class="tm-board"></div>

    <div style="text-align:center;margin:8px 0 20px">
        <button class="tm-add-tier-btn" onclick="window._tmAddTier()">+ 티어 추가</button>
    </div>

    <div class="tm-pool-section">
        <div class="tm-pool-header">
            <span class="tm-pool-title">미배치</span>
            <div class="tm-pool-search-wrap">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
                     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>
                </svg>
                <input id="tm-pool-search" type="text" class="tm-pool-search"
                    placeholder="이름 검색..."
                    oninput="window._tmSetFilter(this.value)">
            </div>
        </div>
        <div id="tm-pool" class="tm-pool"
            ondragover="window._tmDragOver(event,'pool')"
            ondragleave="window._tmDragLeave(event)"
            ondrop="window._tmDrop(event,'pool')"></div>
    </div>
</div>

<div id="tm-popup" class="tm-popup" style="display:none"></div>

<!-- 사도 추가 패널 -->
<div id="tm-add-overlay" style="display:none" class="tm-add-overlay"
    onclick="if(event.target===this)window._tmCloseAddModal()">
    <div class="tm-add-panel">
        <div class="tm-add-pheader">
            <span id="tm-add-ptitle" class="tm-add-ptitle"></span>
            <div class="tm-add-psearch-wrap">
                <svg class="tm-add-psearch-icon" viewBox="0 0 24 24" width="13" height="13" fill="none"
                    stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input id="tm-add-psearch" type="text" class="tm-add-psearch" placeholder="이름 검색..."
                    oninput="window._tmAddSearch(this.value)">
            </div>
            <button class="tm-add-pclose" onclick="window._tmCloseAddModal()" aria-label="닫기">✕</button>
        </div>
        <div id="tm-add-pbody" class="tm-add-pbody"></div>
    </div>
</div>

<script>
    document.write('<scr' + 'ipt src="tiermaker.js?v=' + APP_VERSION + '"><\/scr' + 'ipt>');
</script>
<script>
(async function () {
    const v = APP_VERSION;
    const res = await fetch('./data/DB.csv?v=' + v);
    const text = await res.text();
    window._tmDB = Papa.parse(text, { header: true, skipEmptyLines: true, trimHeaders: true }).data;
    window.dispatchEvent(new Event('tm-db-loaded'));
})();
</script>

<!-- 모바일 경고 토스트 — 드래그 앤 드롭이 터치에서 동작하지 않아 티어 메이커에만 표시 -->
<div id="mobile-toast" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    z-index:1500;background:var(--text-dark);color:#fff;border-radius:14px;
    padding:13px 18px 13px 16px;display:none;align-items:center;gap:12px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);font-size:0.84rem;font-weight:600;
    font-family:'OneMobilePop',sans-serif;white-space:nowrap;max-width:calc(100vw - 32px);">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#FBBF24" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <span>티어 메이커는 PC 환경에서 이용해 주세요</span>
    <button onclick="document.getElementById('mobile-toast').style.display='none';sessionStorage.setItem('mob-warn','1')"
        style="background:rgba(255,255,255,0.15);border:none;color:#fff;border-radius:8px;
        padding:4px 10px;cursor:pointer;font-size:0.8rem;font-family:inherit;flex-shrink:0;">닫기</button>
</div>
<script>
(function(){
    if(sessionStorage.getItem('mob-warn')) return;
    if(window.innerWidth < 768 || /Mobi|Android|iPhone/i.test(navigator.userAgent)){
        var t = document.getElementById('mobile-toast');
        t.style.display = 'flex';
    }
})();
</script>

</body>
</html>
